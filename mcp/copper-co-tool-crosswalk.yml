source: mcp/copper-co-mcp.yml + openapi/copper-co-platform-openapi.json
summary: >-
  Copper has BOTH a live MCP server and a published OpenAPI, but they do not overlap at
  all. The MCP server is the Mintlify documentation server bundled with the developer
  portal: its three tools search and read the docs. The OpenAPI describes 88 REST
  operations over custody, orders, lending and ClearLoop. Not one MCP tool binds to a REST
  operation, so the crosswalk[] is empty by observation, not by omission — every MCP tool
  is mcp_only and every REST operation is rest_only. This is the honest, and the
  interesting, result: an agent can READ Copper's docs over MCP but cannot ACT on Copper's
  platform over MCP.
surfaces:
  openapi:
    file: openapi/copper-co-platform-openapi.json
    source: https://developer.copper.co/copper-open-api-public.json
    version: 3.1.0
    operations: 88
    paths: 78
    gated: false
    operation_ids: false
    operation_ids_note: >-
      CRITICAL for binding: not a single one of the 88 operations declares an operationId.
      Any crosswalk row would have to bind to "METHOD path" rather than a stable
      operationId, and any generated SDK/tool name would be synthesized rather than
      provider-controlled. Operations are identified here by method + path.
  graphql:
    endpoint: null
    note: Copper publishes no GraphQL surface.
  mcp:
    url: https://developer.copper.co/mcp
    gated: false
    tools_list: 200 anonymous — real tool set with inputSchema retrieved live
    scope: documentation only
