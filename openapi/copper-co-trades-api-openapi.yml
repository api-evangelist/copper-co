components:
  schemas:
    ActionTrade:
      properties:
        organizationId:
          description: Organization ID of the requesting party
          type: string
        tradeActionId:
          description: Unique identifier of the trade action being acted upon
          type: string
        tradeId:
          description: Unique identifier of the trade
          type: string
      required:
      - tradeActionId
      - tradeId
      - organizationId
      type: object
    TradeActionExtra:
      properties:
        acceptedAt:
          description: Time when the action was accepted. Format is unix timestamp (ms)
          type: string
        acceptedBy:
          description: User ID of the person who accepted the action
          type: string
        cancelledAt:
          description: Time when the action was cancelled. Format is unix timestamp (ms)
          type: string
        cancelledBy:
          description: User ID of the person who cancelled the action
          type: string
        closeTradeAction:
          $ref: '#/components/schemas/CloseTradeAction'
          description: Details of the close trade action, if applicable
          type: object
        collateralProviderId:
          description: Counterparty ID of the collateral provider involved in the action
          type: string
        defaultTradeAction:
          $ref: '#/components/schemas/DefaultTradeAction'
          description: Details of the default trade action, if applicable
          type: object
        rejectedAt:
          description: Time when the action was rejected. Format is unix timestamp (ms)
          type: string
        rejectedBy:
          description: User ID of the person who rejected the action
          type: string
        requestReleaseCollateralAction:
          $ref: '#/components/schemas/RequestReleaseCollateralAction'
          description: Details of the request release collateral action, if applicable
          type: object
        requestTopUpTradeAction:
          $ref: '#/components/schemas/RequestTopUpTradeAction'
          description: Details of the request top-up trade action, if applicable
          type: object
        secureCollateralAction:
          $ref: '#/components/schemas/SecureCollateralAction'
          description: Details of the secure collateral action, if applicable
          type: object
      type: object
    ReviewType:
      enum:
      - approve
      - reject
      type: string
    DeclineTrade:
      properties:
        organizationId:
          description: Organization ID of the requesting party
          type: string
        tradeId:
          description: Unique identifier of the trade to decline
          type: string
      required:
      - organizationId
      - tradeId
      type: object
    CloseTradeAction:
      properties:
        collateralDetails:
          description: List of collateral positions being released as part of the close
          items:
            $ref: '#/components/schemas/CollateralDetails'
          type: array
        toPortfolioId:
          description: Portfolio ID to release collateral to upon closing
          type: string
      required:
      - toPortfolioId
      type: object
    CloseTrade:
      properties:
        organizationId:
          description: Organization ID of the requesting party
          type: string
        toPortfolioId:
          description: Portfolio ID to release collateral to upon closing; defaults to originating portfolio if omitted
          type: string
        tradeId:
          description: Unique identifier of the trade to close
          type: string
      required:
      - tradeId
      - organizationId
      type: object
    ReviewTopUpRequest:
      properties:
        organizationId:
          description: Organization ID of the reviewing party
          type: string
        reviewType:
          $ref: '#/components/schemas/ReviewType'
          description: 'Review decision: approve or reject. [See details](/enums/ReviewType)'
        topUpDetails:
          description: Collateral top-up details to apply when approving; required if reviewType is approve
          items:
            $ref: '#/components/schemas/TopUpTradeDetail'
          type: array
        tradeActionId:
          description: Unique identifier of the top-up trade action being reviewed
          type: string
        tradeId:
          description: Unique identifier of the trade
          type: string
      required:
      - tradeId
      - organizationId
      - tradeActionId
      - reviewType
      type: object
    CancelTrade:
      properties:
        organizationId:
          description: Organization ID of the requesting party
          type: string
        tradeId:
          description: Unique identifier of the trade to cancel
          type: string
      required:
      - organizationId
      - tradeId
      type: object
    DefaultTradeAction:
      properties:
        defaultReason:
          description: Optional reason for the default
          type: string
        toPortfolioId:
          description: Portfolio ID to transfer defaulted collateral to
          type: string
      required:
      - toPortfolioId
      type: object
    SecureCollateralAction:
      properties:
        amount:
          description: Amount of collateral being secured
          type: string
        currency:
          description: Currency of the collateral amount
          type: string
        fromPortfolioId:
          description: Portfolio ID the collateral is transferred from
          type: string
        mainCurrency:
          description: Network of the currency (E.G. "SOL" for Solana network)
          type: string
        toPortfolioId:
          description: Portfolio ID the collateral is transferred to
          type: string
      required:
      - amount
      - currency
      - mainCurrency
      - fromPortfolioId
      - toPortfolioId
      type: object
    CollateralTransactionType:
      enum: []
      type: string
    CreateTrade:
      properties:
        collateralPortfolioId:
          description: Portfolio ID to use as collateral source for the creator
          type: string
        counterpartyId:
          description: Counterparty ID of the intended trade acceptor
          type: string
        effectiveDate:
          description: Time when the trade becomes effective. Format is unix timestamp (ms)
          type: string
        maturityDate:
          description: Time when the trade matures; omit for open-ended trades. Format is unix timestamp (ms)
          type: string
        organizationId:
          description: Organization ID of the trade creator
          type: string
        requiredCollaterals:
          description: List of collateral obligations required for this trade
          items:
            $ref: '#/components/schemas/InitialCollateral'
          type: array
        tradeReferenceId:
          description: External reference ID for the trade, provided by the creator
          type: string
        tradeSide:
          $ref: '#/components/schemas/TradeSide'
          description: Side of the trade from the creator's perspective (buy, sell, not-applicable)
        tradeType:
          $ref: '#/components/schemas/TradeType'
          description: Type of trade (forward, option, swap, other, not-applicable)
      required:
      - organizationId
      - counterpartyId
      - tradeReferenceId
      - tradeType
      - tradeSide
      - effectiveDate
      - requiredCollaterals
      type: object
    CollateralTransactionStatus:
      enum:
      - new
      - order-created
      - awaiting-funds
      - awaiting-signature
      - completed
      - failed
      type: string
    CollateralActionDetails:
      properties: {}
      type: object
    TopUpTradeCollateral:
      properties:
        collateralDetails:
          description: List of collateral positions to add to the trade
          items:
            $ref: '#/components/schemas/CollateralDetails'
          type: array
        organizationId:
          description: Organization ID of the requesting party
          type: string
        tradeId:
          description: Unique identifier of the trade to top up collateral for
          type: string
      required:
      - tradeId
      - organizationId
      - collateralDetails
      type: object
    DefaultTrade:
      properties:
        defaultReason:
          description: Optional reason for the default
          type: string
        organizationId:
          description: Organization ID of the requesting party
          type: string
        toPortfolioId:
          description: Portfolio ID to transfer defaulted collateral to
          type: string
        tradeId:
          description: Unique identifier of the trade to default
          type: string
      required:
      - tradeId
      - organizationId
      - toPortfolioId
      type: object
    Trades:
      properties:
        trades:
          description: List of trades matching the query
          items:
            $ref: '#/components/schemas/Trade'
          type: array
      type: object
    Collateral:
      properties:
        amount:
          description: The amount of the transferred collateral
          type: string
        collateralId:
          description: Unique identifier of the collateral
          type: string
        collateralType:
          $ref: '#/components/schemas/CollateralType'
          description: The type of collateral. [See details](/enums/CollateralType)
        createdAt:
          description: Timestamp in epoch milliseconds of the collateral creation
          type: string
        currency:
          description: Currency code of the asset being used for collateral
          type: string
        externalId:
          description: The unique identifier of associated trade or loan
          type: string
        mainCurrency:
          description: Currency code of the network being used to transfer the collateral
          type: string
        portfolioId:
          description: The account where the collateral is being held
          type: string
        unrealisedAmount:
          description: The amount of pending collateral funds; can be positive and negative
          type: string
        updatedAt:
          description: Timestamp in epoch milliseconds of the last collateral update
          type: string
      required:
      - collateralId
      - externalId
      - collateralType
      - amount
      - currency
      - mainCurrency
      - createdAt
      type: object
    TradeActionType:
      enum:
      - secure-collateral
      - close-trade
      - default-trade
      - top-up-collateral
      - top-up-collateral-request
      - release-collateral-request
      type: string
    ReleaseCollateralRequest:
      properties:
        collateralDetails:
          description: List of collateral positions to release
          items:
            $ref: '#/components/schemas/CollateralDetails'
          type: array
        organizationId:
          description: Organization ID of the requesting party
          type: string
        tradeId:
          description: Unique identifier of the trade to request collateral release for
          type: string
      required:
      - tradeId
      - organizationId
      - collateralDetails
      type: object
    Trade:
      properties:
        acceptedAt:
          description: Time when the trade was accepted. Format is Unix timestamp (ms)
          type: string
        acceptedBy:
          description: User ID of the person who accepted the trade
          type: string
        createdAt:
          description: Time when the trade was created. Format is unix timestamp (ms)
          type: string
        createdBy:
          description: User ID of the person who created the trade
          type: string
        effectiveDate:
          description: Time when the trade becomes effective. Format is unix timestamp (ms)
          type: string
        embedded:
          $ref: '#/components/schemas/TradeEmbedded'
          description: Additional data linked to the trade
          type: object
        maturityDate:
          description: Time when the trade matures; null if open-ended. Format is unix timestamp (ms)
          type: string
        requiredCollaterals:
          description: List of collateral obligations required for this trade
          items:
            $ref: '#/components/schemas/RequiredCollateral'
          type: array
        securedCollaterals:
          description: List of collateral positions already secured against this trade
          items:
            $ref: '#/components/schemas/Collateral'
          type: array
        tradeAcceptorCounterpartyId:
          description: Counterparty ID of the trade acceptor
          type: string
        tradeAcceptorOrganizationId:
          description: Organization ID of the trade acceptor
          type: string
        tradeAcceptorPortfolioId:
          description: Portfolio ID of the trade acceptor used for collateral
          type: string
        tradeCreatorCounterpartyId:
          description: Counterparty ID of the trade creator
          type: string
        tradeCreatorOrganizationId:
          description: Organization ID of the trade creator
          type: string
        tradeCreatorPortfolioId:
          description: Portfolio ID of the trade creator used for collateral
          type: string
        tradeId:
          description: Unique identifier of the trade
          type: string
        tradeReferenceId:
          description: External reference ID for the trade, provided by the creator
          type: string
        tradeSide:
          $ref: '#/components/schemas/TradeSide'
          description: Side of the trade from the creator's perspective (buy, sell, not-applicable)
        tradeStatus:
          $ref: '#/components/schemas/TradeStatus'
          description: Current status of the trade
        tradeType:
          $ref: '#/components/schemas/TradeType'
          description: Type of trade (e.g. forward, option, swap, other, not-applicable)
        updatedAt:
          description: Time when the trade was last updated. Format is unix timestamp (ms)
          type: string
        updatedBy:
          description: User ID of the person who last updated the trade
          type: string
      required:
      - tradeId
      - tradeCreatorCounterpartyId
      - tradeAcceptorCounterpartyId
      - tradeReferenceId
      - tradeType
      - tradeSide
      - tradeStatus
      - effectiveDate
      - createdAt
      type: object
    TradeActionStatus:
      enum:
      - new
      - awaiting-acceptance
      - accepted
      - cancelled
      - failed
      - completed
      - rejected
      - processing
      - requires-manual-intervention
      type: string
    TradeActionEmbedded:
      properties:
        collateralTransactions:
          description: List of collateral transactions associated with this trade action
          items:
            $ref: '#/components/schemas/CollateralTransaction'
          type: array
      type: object
    RequestTopUpTradeAction:
      properties:
        collateralActionDetails:
          description: List of collateral positions requested in this top-up action
          items:
            $ref: '#/components/schemas/CollateralActionDetails'
          type: array
      required:
      - collateralActionDetails
      type: object
    SecureTradeCollateral:
      properties:
        collateralDetails:
          description: List of collateral positions to secure for this trade
          items:
            $ref: '#/components/schemas/CollateralDetails'
          type: array
        organizationId:
          description: Organization ID of the requesting party
          type: string
        tradeId:
          description: Unique identifier of the trade to secure collateral for
          type: string
      required:
      - tradeId
      - organizationId
      - collateralDetails
      type: object
    TradeAction:
      properties:
        acceptorCounterpartyId:
          description: Counterparty ID of the party who must respond to the action
          type: string
        actionType:
          $ref: '#/components/schemas/TradeActionType'
          description: The type of the action. [See details](/enums/TradeActionType)
        createdAt:
          description: Time when the action was created. Format is unix timestamp (ms)
          type: string
        createdBy:
          description: User ID of the person who created the action
