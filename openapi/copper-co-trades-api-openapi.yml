openapi: 3.2.0
info:
  description: 'Copper API is based on the REST API interface provided for data exchange between a client and a server with the use of HTTPS requests and responses.

    By default, the request should include a Content-Type header set as application/json. Some requests require different header fields, as well as other Content-Type values. In this case, a proper header will be stated in an example.

    When interacting with the API, please note that all numerical values, such as order amounts or timestamps, should be transmitted as strings. This ensures consistent data representation and prevents potential issues with floating-point precision'
  title: Copper Platform Trades API
  version: latest
servers:
- description: platform.copper.co
  url: https://api.copper.co/platform
- description: demo.copper.co
  url: https://api.stage.copper.co/platform
- description: testnet.copper.co
  url: https://api.testnet.copper.co/platform
tags:
- name: trades
paths:
  /trades:
    get:
      description: Retrieve a list of trades for the given organization.
      parameters:
      - description: Organization ID to scope the search
        in: query
        name: organizationId
        required: true
        schema:
          type: string
      - description: Filter by trade ID
        in: query
        name: tradeId
        required: false
        schema:
          type: string
      - description: Filter by external trade reference ID
        in: query
        name: tradeReferenceId
        required: false
        schema:
          type: string
      - description: Filter trades with effective date on or after this. Format is unix timestamp (ms)
        in: query
        name: effectiveDateFrom
        required: false
        schema:
          type: string
      - description: Filter trades with effective date on or before this. Format is unix timestamp (ms)
        in: query
        name: effectiveDateTo
        required: false
        schema:
          type: string
      - description: Filter trades with maturity date on or after this. Format is unix timestamp (ms)
        in: query
        name: maturityDateFrom
        required: false
        schema:
          type: string
      - description: Filter trades with maturity date on or before this. Format is unix timestamp (ms)
        in: query
        name: maturityDateTo
        required: false
        schema:
          type: string
      - description: Filter by trade side (buy, sell, not-applicable)
        in: query
        name: tradeSide
        required: false
        schema:
          $ref: '#/components/schemas/TradeSide'
          type: string
      - description: Filter by trade status
        example:
        - active
        in: query
        name: tradeStatus
        required: false
        schema:
          $ref: '#/components/schemas/TradeStatus'
          type: string
      - description: Filter by trade type (forward, option, swap, other, not-applicable)
        example:
        - forward
        in: query
        name: tradeType
        required: false
        schema:
          $ref: '#/components/schemas/TradeType'
          type: string
      - description: Filter by counterparty ID (creator or acceptor)
        in: query
        name: counterpartyId
        required: false
        schema:
          type: string
      - description: When true, includes collateral details in the response
        in: query
        name: includeCollateral
        required: false
        schema:
          type: boolean
      - description: When true, includes counterparty details in the response
        in: query
        name: includeCounterparties
        required: false
        schema:
          type: boolean
      - description: When true, includes trade actions in the response
        in: query
        name: includeTradeActions
        required: false
        schema:
          type: boolean
      - description: When true, includes collateral transactions in the response
        in: query
        name: includeCollateralTransactions
        required: false
        schema:
          type: boolean
      - description: Maximum number of results to return.
        in: query
        name: limit
        required: false
        schema:
          default: '100'
          type: string
      - description: Number of results to skip for pagination
        in: query
        name: offset
        required: false
        schema:
          default: '0'
          type: string
      - description: When true, returns only open trades; when false, returns only closed trades
        in: query
        name: isOpen
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trades'
          description: OK
        '400':
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: The machine-readable error code
                    examples:
                    - bad-request
                    type: string
                  message:
                    description: A human-readable message providing more details about the error
                    type: string
                type: object
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: The machine-readable error code
                    examples:
                    - forbidden
                    type: string
                  message:
                    description: A human-readable message providing more details about the error
                    type: string
                type: object
          description: Forbidden
        '409':
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: The machine-readable error code
                    examples:
                    - conflict
                    type: string
                  message:
                    description: A human-readable message providing more details about the error
                    type: string
                type: object
          description: Conflict
      summary: Get Trades
      tags:
      - trades
    post:
      description: Initiate a new trade. The counterparty will need to accept the trade.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrade'
      responses:
        '200':
          content:
            application/json:
              schema:
