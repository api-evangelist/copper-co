openapi: 3.2.0
info:
  description: Copper API is based on the REST API interface provided for data exchange between a client and a server with the use of HTTPS requests and responses.
  title: Copper Platform Lending API
  version: latest
servers:
- description: platform.copper.co
  url: https://api.copper.co/platform
- description: demo.copper.co
  url: https://api.stage.copper.co/platform
- description: testnet.copper.co
  url: https://api.testnet.copper.co/platform
tags:
- name: Lending
paths:
  /organizations/{organizationId}/loans:
    get:
      description: Retrieve loans
      parameters:
      - description: The account to filter by
        in: query
        name: portfolioId
        required: false
        schema:
          type: string
      - description: The list of loan ids to filter by
        in: query
        name: loanIds
        required: false
        schema:
          items:
            type: string
          type: array
      - description: The loan side to filter by. [See details](/enums/LoanSide)
        example:
        - lend
        in: query
        name: loanSide
        required: false
        schema:
          $ref: '#/components/schemas/LoanSide'
          type: string
      - description: The loan type to filter by. [See details](/enums/LoanType)
        in: query
        name: loanType
        required: false
        schema:
          $ref: '#/components/schemas/LoanType'
          type: string
      - description: '[See details](/enums/LoanType)'
        in: query
        name: loanTypes
        required: false
        schema:
          items:
            $ref: '#/components/schemas/LoanType'
          type: array
      - description: The loan status to filter by. [See details](/enums/LoanStatus)
        example:
        - disbursing,active
        in: query
        name: statuses
        required: false
        schema:
          items:
            $ref: '#/components/schemas/LoanStatus'
          type: array
      - description: Flag to filter out open loans
        in: query
        name: isOpen
        required: false
        schema:
          default: 'false'
          type: boolean
      - description: Flag indicating if collaterals should be included in embedded
        in: query
        name: includeCollaterals
        required: false
        schema:
          default: 'false'
          type: boolean
      - description: Flag indicating if counterparties should be included in embedded
        in: query
        name: includeCounterparties
        required: false
        schema:
          default: 'false'
          type: boolean
      - description: Flag indicating if child loans should be included in embedded - Only applicable for agency lending parent loans
        in: query
        name: includeChildLoans
        required: false
        schema:
          default: 'false'
          type: boolean
      - description: Flag indicating if allocations should be included in embedded
        in: query
        name: includeLoanAllocations
        required: false
        schema:
          default: 'false'
          type: boolean
      - description: Flag indicating if loan interest should be included in embedded - Only applicable for bilateral loans
        in: query
        name: includeLoanInterest
        required: false
        schema:
          default: 'false'
          type: boolean
      - description: The number of loans to include in the response
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: The number of loans to skip in the response
        in: query
        name: offset
        required: false
        schema:
          type: string
      - description: 'The field to sort by. Currently supported: updatedAt'
        in: query
        name: sortBy
        required: false
        schema:
          default: LoanStatus by relevance
          type: string
      - description: The direction to sort by - must be used in conjunction with sortBy. [See details](/enums/SortingDirection)
        in: query
        name: sortDirection
        required: false
        schema:
          $ref: '#/components/schemas/SortingDirection'
          default: desc
          type: string
      - in: path
        name: organizationId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loans'
          description: OK
        '400':
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: The machine-readable error code
                    examples:
                    - bad-request
                    type: string
                  message:
                    description: A human-readable message providing more details about the error
                    type: string
                type: object
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: The machine-readable error code
                    examples:
                    - forbidden
                    type: string
                  message:
                    description: A human-readable message providing more details about the error
                    type: string
                type: object
          description: Forbidden
        '409':
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: The machine-readable error code
                    examples:
                    - conflict
                    type: string
                  message:
                    description: A human-readable message providing more details about the error
                    type: string
                type: object
          description: Conflict
      summary: Get Loans
      tags:
      - Lending
      operationId: getOrganizationsByOrganizationIdLoans
      x-operation-id-source: derived
    patch:
      description: Obtain the loan LTV or needed collateral amount for given loan parameters.
      parameters:
