aid: copper-co
name: Copper.co
description: 'Copper is an institutional digital asset infrastructure provider headquartered
  in Zug, Switzerland, offering custody, prime services and collateral management to
  hedge funds, trading firms, exchanges, ETP providers, foundations and miners. Its
  Copper Platform API is a REST API over portfolios (called "accounts" in the UI),
  wallets, orders, transfers, withdrawals, staking, agency and bilateral lending, and
  ClearLoop — Copper''s off-exchange settlement and collateral network that lets clients
  trade on connected exchanges while assets remain in custody. The API authenticates
  with an API key plus a per-request HMAC-SHA256 signature, publishes OpenAPI 3.1 specifications
  and a Postman collection, and offers a webhook system for real-time order, deposit,
  withdrawal, ClearLoop and address-book events.'
