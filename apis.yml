apis:
- aid: copper-co-platform-api
  name: Copper Platform API
  description: 'REST API for the Copper institutional digital asset platform. Covers
    organizations, portfolios, wallets and balances, the crypto address book, orders
    (transfers, withdrawals, staking, smart calls, settlements), deposit targets, currencies,
    reports, blockchain address validation, agency and bilateral lending, and ClearLoop
    off-exchange settlement. Authenticated with an API key plus a per-request HMAC-SHA256
    signature over timestamp + method + path + body.'
