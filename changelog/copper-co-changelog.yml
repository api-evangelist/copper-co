- date: '2026-06-05'
  tags:
  - Improvements
  title: 'Documentation update: Highlighted terminal order statuses'
  breaking: false
  highlights:
  - Order status descriptions updated to note that a completed order enters a final "terminal" status.
  - 'Terminal statuses at time of writing: EXECUTED, CANCELED, LIQUIDATED, ERROR, BLOCKED, DECLINED, SUSPENDED, REJECTED.'
- date: '2026-03-10'
  tags:
  - New features
  title: New order-completed webhook event
  breaking: false
  additions:
  - New webhook event `order-completed`, covering orders with status `executed`.
  - No filters applied — all order types (deposits, withdrawals, buy, sell, etc.) are included.
- date: '2026-02-16'
  tags:
  - Improvements
  title: Added updatedAt field in ClearLoop actions endpoint
  breaking: false
  additions:
  - '`updatedAt` field added to the clearloop/actions endpoint returning ClearLoop delegations/undelegations.'
- date: '2026-01-29'
  tags:
  - Improvements
  title: Lending API improvements
  breaking: true
  breaking_note: >-
    Eight loan types were deprecated and renamed. Deprecated types are automatically
    migrated to their replacements; old types will be removed from the API and
    documentation following the migration.
  deprecations:
  - from: agency-lending-parent-loan
    to: agency-inventory
  - from: agency-lending-collateralised-child-loan
    to: agency-title-transfer-collateralised-loan
  - from: agency-lending-pledge-collateralised-child-loan
    to: agency-pledge-collateralised-loan
  - from: agency-lending-uncollateralised-child-loan
    to: agency-uncollateralised-loan
  - from: agency-lending-first-lien-child-loan
    to: agency-clearloop-loan
  - from: bilateral-lending-title-transfer-collateralised-loan
    to: bilateral-title-transfer-collateralised-loan
  - from: bilateral-lending-pledge-collateralised-loan
    to: bilateral-pledge-collateralised-loan
  - from: bilateral-lending-uncollateralised-loan
    to: bilateral-uncollateralised-loan
  additions:
  - '`marginCallExpiryPeriod` field (1-24 hours) and `marginCall` object added to the Lending API, for collateralised non-ClearLoop loans.'
- date: '2026-01-28'
  tags:
  - Improvements
  title: New settlementStatus field in ClearLoop portfolio responses
  breaking: false
  additions:
  - '`settlementStatus` field added to responses returning ClearLoop portfolios, carrying the status of the last settlement cycle.'
- date: '2026-01-05'
  tags:
