  title: Early termination of ClearLoop loans
  breaking: false
  additions:
  - 'New endpoint PATCH /platform/organizations/{organizationId}/loans/{earlyTerminationLoanId} allowing Copper''s Agency Desk to recall outstanding loans on breach of terms.'
